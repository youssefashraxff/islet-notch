name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version
      - name: Build adapter
        run: |
          command -v cmake >/dev/null || brew install cmake
          ./Scripts/setup-adapter.sh
      - name: Build Islet.app
        run: ./Scripts/bundle.sh
